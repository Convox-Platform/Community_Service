syntax = "proto3";

option csharp_namespace = "Community_Service.Messages.Grpc";

package message.v1;

service MessageService {
  rpc UpsertSystemMessage (UpsertSystemMessageRequest) returns (MessageResponse);
}

message UpsertSystemMessageRequest {
  int64 chat_id = 1;
  int64 community_id = 2;
  int64 message_id = 3;
  string content = 4;
  string system_payload = 5;
}

message MessageResponse {
  int64 id = 1;
}
