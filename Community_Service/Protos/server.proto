syntax = "proto3";

import "Protos/channel.proto";

option csharp_namespace = "Community_Service";

package Server_Service;


service Server {
	rpc CreateService (ServiceRequest) returns (ServiceResponse);
 
}

message ServiceRequest {
  string name = 1;
  string description = 2;
  string image = 3;
}

message ServiceResponse {
  int64 id = 1;
  string name = 2;
  string description = 3;
  string Image = 4;
  repeated Channel_Service.ChannelResponse channels = 5;
}


